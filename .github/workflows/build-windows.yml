name: Build Windows

# Builds the packaged Windows application and runs its selftest.
# NOTE: first execution happens after the repository is pushed to GitHub
# (owner decision Q2: CI-built Windows artifacts).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller itopshub.spec --noconfirm
      - name: Run packaged selftest (exit code)
        # The exe is a windowed (GUI-subsystem) binary: PowerShell does not
        # wait for it, so use Start-Process -Wait and read ExitCode.
        run: |
          $env:ITOPS_HUB_DATA_DIR = "D:\a\selftest-data"
          $proc = Start-Process -FilePath "./dist/ITOpsHub/ITOpsHub.exe" `
            -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "selftest-stdout.txt"
          Get-Content "selftest-stdout.txt"
          if ($proc.ExitCode -ne 0) {
            Write-Host "=== selftest diagnostic ==="
            Get-Content "$env:TEMP\itopshub-selftest.log" -ErrorAction SilentlyContinue
            Get-Content "D:\a\selftest-data\logs\itops-hub.log" -Tail 30 -ErrorAction SilentlyContinue
            throw "selftest failed: $($proc.ExitCode)"
          }
        shell: pwsh
      - name: Build installer (Inno Setup)
        run: |
          choco install -y innosetup --no-progress
          iscc scripts/installer.iss
        shell: pwsh
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITOpsHub-windows-x64
          path: dist/ITOpsHub/
          if-no-files-found: error
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITOpsHub-Setup
          path: dist/ITOpsHub-Setup.exe
          if-no-files-found: error
