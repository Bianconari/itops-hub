name: Build Windows

# Builds the packaged Windows application and runs its selftest.
# NOTE: first execution happens after the repository is pushed to GitHub
# (owner decision Q2: CI-built Windows artifacts).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller itopshub.spec --noconfirm
      - name: Run packaged selftest (exit code)
        # The exe is a windowed (GUI-subsystem) binary: PowerShell does not
        # wait for it, so use Start-Process -Wait and read ExitCode.
        run: |
          $env:ITOPS_HUB_DATA_DIR = "D:\a\selftest-data"
          $proc = Start-Process -FilePath "./dist/ITOpsHub/ITOpsHub.exe" `
            -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "selftest-stdout.txt"
          Get-Content "selftest-stdout.txt"
          if ($proc.ExitCode -ne 0) {
            Write-Host "=== selftest diagnostic ==="
            Get-Content "$env:TEMP\itopshub-selftest.log" -ErrorAction SilentlyContinue
            Get-Content "D:\a\selftest-data\logs\itops-hub.log" -Tail 30 -ErrorAction SilentlyContinue
            throw "selftest failed: $($proc.ExitCode)"
          }
        shell: pwsh
      - name: Build installer (Inno Setup)
        run: |
          choco install -y innosetup --no-progress
          iscc scripts/installer.iss
        shell: pwsh
      - name: Installer smoke test (silent install -> run -> uninstall)
        run: |
          $setup = ".\dist\ITOpsHub-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not found" }
          # 1) silent install (per-user, PrivilegesRequired=lowest)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\ITOps Hub\ITOpsHub.exe"
          if (-not (Test-Path $exe)) { throw "installed exe missing at $exe" }
          Write-Host "installed: $exe"
          # 2) installed exe passes selftest
          $env:ITOPS_HUB_DATA_DIR = "D:\a\installed-selftest-data"
          $sp = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "installed-selftest.txt"
          Get-Content "installed-selftest.txt"
          if ($sp.ExitCode -ne 0) { throw "installed selftest failed: $($sp.ExitCode)" }
          # 3) uninstall silently and verify removal
          $unins = "$env:LOCALAPPDATA\Programs\ITOps Hub\unins000.exe"
          if (-not (Test-Path $unins)) { throw "uninstaller missing" }
          $u = Start-Process $unins -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall failed: $($u.ExitCode)" }
          if (Test-Path $exe) { throw "exe still present after uninstall" }
          Write-Host "install/uninstall smoke test PASSED"
        shell: pwsh
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITOpsHub-windows-x64
          path: dist/ITOpsHub/
          if-no-files-found: error
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITOpsHub-Setup
          path: dist/ITOpsHub-Setup.exe
          if-no-files-found: error
