[project]
name = "itops-hub"
version = "1.2.0"
description = "ITOps Hub - modular desktop IT operations platform: diagnostics, network discovery, monitoring, log analysis, backups, reporting, and automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ITOps Hub Contributors" }]
keywords = ["it-operations", "monitoring", "network", "desktop", "pyside6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["app.domain", "app.services", "app.application"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "ui: offscreen Qt UI tests",
]
